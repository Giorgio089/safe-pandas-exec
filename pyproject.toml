[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-pandas-exec"
version = "0.1.0"
description = "Run LLM-generated pandas code with AST validation, a restricted subprocess and a generate-run-critic retry loop. Provider-agnostic."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23"]
keywords = ["llm", "pandas", "sandbox", "agents", "code-execution"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_pandas_exec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
